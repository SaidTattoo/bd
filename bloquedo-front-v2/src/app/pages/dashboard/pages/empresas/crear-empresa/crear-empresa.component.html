<app-dashboard-layout>
  <div class="min-h-screen bg-gray-50 p-6">
    <!-- Header -->
    <div class="mb-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Nueva Empresa</h1>
          <p class="mt-2 text-gray-600">Registra una nueva empresa en el sistema</p>
        </div>
        <div class="flex space-x-4">
          <button
            (click)="goBack()"
            class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
          >
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Volver
          </button>
          <button
            (click)="goToDashboard()"
            class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
          >
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Dashboard
          </button>
        </div>
      </div>
    </div>

    <!-- Formulario Simplificado -->
    <div class="max-w-2xl mx-auto">
      <form [formGroup]="empresaForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Información Básica -->
        <div class="bg-white shadow-sm rounded-lg p-6">
          <h2 class="text-lg font-medium text-gray-900 mb-6">Información Básica</h2>
          
          <div class="space-y-4">
            <!-- Nombre -->
            <div>
              <label for="nombre" class="block text-sm font-medium text-gray-700">
                Nombre de la Empresa *
              </label>
              <input
                id="nombre"
                type="text"
                formControlName="nombre"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                [class.border-red-500]="isFieldInvalid('nombre')"
                [class.border-green-500]="isFieldValid('nombre')"
                placeholder="Ingrese el nombre de la empresa"
              />
              <p *ngIf="isFieldInvalid('nombre')" class="mt-1 text-sm text-red-600">
                {{ getFieldError('nombre') }}
              </p>
            </div>

            <!-- RUT -->
            <div>
              <label for="rut" class="block text-sm font-medium text-gray-700">
                RUT *
              </label>
              <input
                id="rut"
                type="text"
                formControlName="rut"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                [class.border-red-500]="isFieldInvalid('rut')"
                [class.border-green-500]="isFieldValid('rut')"
                placeholder="12345678-9"
              />
              <p *ngIf="isFieldInvalid('rut')" class="mt-1 text-sm text-red-600">
                {{ getFieldError('rut') }}
              </p>
            </div>

            <!-- Razón Social -->
            <div>
              <label for="razonSocial" class="block text-sm font-medium text-gray-700">
                Razón Social *
              </label>
              <input
                id="razonSocial"
                type="text"
                formControlName="razonSocial"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                [class.border-red-500]="isFieldInvalid('razonSocial')"
                [class.border-green-500]="isFieldValid('razonSocial')"
                placeholder="Ingrese la razón social"
              />
              <p *ngIf="isFieldInvalid('razonSocial')" class="mt-1 text-sm text-red-600">
                {{ getFieldError('razonSocial') }}
              </p>
            </div>

            <!-- Email -->
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700">
                Email *
              </label>
              <input
                id="email"
                type="email"
                formControlName="email"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                [class.border-red-500]="isFieldInvalid('email')"
                [class.border-green-500]="isFieldValid('email')"
                placeholder="empresa@ejemplo.com"
              />
              <p *ngIf="isFieldInvalid('email')" class="mt-1 text-sm text-red-600">
                {{ getFieldError('email') }}
              </p>
            </div>

            <!-- Teléfono -->
            <div>
              <label for="telefono" class="block text-sm font-medium text-gray-700">
                Teléfono
              </label>
              <input
                id="telefono"
                type="tel"
                formControlName="telefono"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                [class.border-red-500]="isFieldInvalid('telefono')"
                [class.border-green-500]="isFieldValid('telefono')"
                placeholder="+56 9 1234 5678"
              />
              <p *ngIf="isFieldInvalid('telefono')" class="mt-1 text-sm text-red-600">
                {{ getFieldError('telefono') }}
              </p>
            </div>
          </div>
        </div>

        <!-- Botones de acción -->
        <div class="flex justify-end space-x-4">
          <button
            type="button"
            (click)="goBack()"
            class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="isSubmitting || empresaForm.invalid"
            class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span *ngIf="!isSubmitting">Crear Empresa</span>
            <span *ngIf="isSubmitting" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Creando...
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</app-dashboard-layout>
